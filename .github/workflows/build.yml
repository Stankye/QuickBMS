name: Linux container build

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build container and test both binaries
        run: docker build --platform linux/amd64 --progress plain -t quickbms:ci .
      - name: Test the runtime image
        run: |
          docker run --rm --network none quickbms:ci --version
          docker run --rm --network none --entrypoint quickbms_4gb_files quickbms:ci --version
          mkdir -p dist
          container_id=$(docker create quickbms:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/quickbms" dist/quickbms
          docker cp "$container_id:/usr/local/bin/quickbms_4gb_files" dist/quickbms_4gb_files
          docker cp "$container_id:/usr/share/doc/quickbms/quickbms-source.tar.gz" dist/quickbms-source.tar.gz
          # Exercise extraction with the minimal runtime libraries, as a non-root user.
          python3 tests/smoke.py quickbms --docker-image quickbms:ci
          python3 tests/smoke.py quickbms_4gb_files --docker-image quickbms:ci
          docker save quickbms:ci | gzip > dist/quickbms-container.tar.gz
          cp LICENSE README.md dist/
          (cd dist && sha256sum quickbms quickbms_4gb_files quickbms-source.tar.gz quickbms-container.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickbms-linux-x86-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
